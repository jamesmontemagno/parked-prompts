# Publishes the extension to the VS Code Marketplace, and optionally to Open VSX.
#
# Publish a GitHub Release with a v* tag, or use Actions > Publish > Run workflow. The
# version is set for you as 1.0.<run number>. A release marked pre-release, or the
# prerelease input, publishes to the Marketplace's pre-release channel.
#
# There is no stored token. The publish job trades this run's GitHub OIDC token for a
# short-lived Marketplace credential, using Trusted Publishing. The build, the tests, and
# their dependencies only run in the verify and package jobs, which cannot mint one.
name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      prerelease:
        description: Publish to the pre-release channel
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: publish-extension
  cancel-in-progress: false

env:
  RELEASE_VERSION: 1.0.${{ github.run_number }}
  RELEASE_TAG: v1.0.${{ github.run_number }}
  CHANNEL_FLAG: ${{ (github.event.release.prerelease || inputs.prerelease) && '--pre-release' || '' }}

jobs:
  verify:
    name: Test (${{ matrix.version }})
    # A manual run only publishes the default branch. A release publishes its tag.
    if: github.event_name == 'release' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        version: [stable, insiders]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - name: Build, typecheck, lint, and unit tests
        run: pnpm check
      - name: Smoke tests inside VS Code
        run: xvfb-run -a pnpm test:vscode
        env:
          VSCODE_VERSION: ${{ matrix.version }}

  package:
    name: Package
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - name: Set the version
        working-directory: packages/extension
        run: npm pkg set "version=$RELEASE_VERSION"
      - name: Package the VSIX
        run: pnpm package:vsix $CHANNEL_FLAG
      - name: Check the VSIX
        working-directory: packages/extension
        run: node scripts/verify-vsix.mts dist/parked-prompts.vsix --version "$RELEASE_VERSION" $CHANNEL_FLAG
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vsix
          path: packages/extension/dist/parked-prompts.vsix
          if-no-files-found: error

  publish:
    name: Publish to the Marketplace
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The Marketplace's Trusted Publishing policy names this workflow file and this
    # environment, so renaming either stops publishing. See RELEASING.md.
    environment:
      name: marketplace
      url: https://marketplace.visualstudio.com/items?itemName=vs-publisher-473885.parked-prompts
    # This is what can mint a publishing credential, so this job only runs pinned actions,
    # installs with no scripts and no cache, and runs vsce from the lockfile.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile --filter parked-prompts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vsix
          path: packages/extension/release
      - name: Check the VSIX one last time
        working-directory: packages/extension
        run: node scripts/verify-vsix.mts release/parked-prompts.vsix --version "$RELEASE_VERSION" $CHANNEL_FLAG
      # --skip-duplicate lets a re-run finish after a publish that already worked.
      - name: Publish
        working-directory: packages/extension
        run: pnpm exec vsce publish --oidc --packagePath release/parked-prompts.vsix --skip-duplicate $CHANNEL_FLAG

  release:
    name: Update the GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vsix
      - name: Create a GitHub Release (manual run)
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          prerelease: ${{ inputs.prerelease }}
          files: parked-prompts.vsix
      - name: Attach the VSIX to the GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: parked-prompts.vsix

  # Optional, and apart from the Marketplace, so a problem here cannot hold up a release.
  # Turn it on with ./tools/setup-repo.sh --open-vsx.
  open-vsx:
    name: Publish to Open VSX
    needs: publish
    if: vars.PUBLISH_OPEN_VSX == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: open-vsx
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile --filter parked-prompts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vsix
          path: packages/extension/release
      - name: Publish
        working-directory: packages/extension
        run: pnpm exec ovsx publish --trusted-publishing --packagePath release/parked-prompts.vsix --skip-duplicate $CHANNEL_FLAG
